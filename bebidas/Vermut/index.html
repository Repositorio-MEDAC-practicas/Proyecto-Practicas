<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Free Soul Drinks — Fiesta consciente</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="styles.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
</head>

<body>

<link rel="stylesheet" href="../../header/header.css">
<div id="header-container"></div>

<script>
fetch("../../header/header.html")
    .then(res=>res.text())
    .then(html=>{
    document.getElementById("header-container").innerHTML = html;

    const script = document.createElement("script");
    script.src = "../../header/header.js";
    document.body.appendChild(script);
    });
</script>

<section id="categories" class="categories">
    <input type="search" id="buscador-input" placeholder="Buscar...">
    <button id="buscador-btn">Buscar</button>

    <div class="cat-grid">
    <div class="cat-item"> <img src="../imagenes/placeholder-1-e1533569576673-960x960.png"> <h3>Vermut rojo</h3> </div>
    <div class="cat-item"> <img src="../imagenes/placeholder-1-e1533569576673-960x960.png"> <h3>Vermut blanco</h3> </div>
    </div>
</section>

<link rel="stylesheet" href="../../footer/footer.css">
<div id="footer-container"></div>

<script>
fetch("../../footer/footer.html")
    .then(res=>res.text())
    .then(html=>{
    document.getElementById("footer-container").innerHTML = html;

    const s=document.createElement("script");
    s.src="../../footer/footer.js";
    document.body.appendChild(s);
    });
</script>

<script src="script.js"></script>

</body>
</html>
